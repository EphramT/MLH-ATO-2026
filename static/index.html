<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raleigh Tax Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="/sentry-config.js"></script>
  <script src="https://browser.sentry-cdn.com/8.42.0/bundle.tracing.replay.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>Raleigh Tax Tracker</h1>
    <p>Where does your city property tax go? <span id="fy"></span></p>
  </header>

  <main>
    <section class="card" id="lookup">
      <label for="address-input">Enter a Raleigh address or a home value</label>
      <div class="search">
        <input id="address-input" autocomplete="off" placeholder="e.g. 1518 Fayetteville St  or  $391,000">
        <ul id="suggestions" hidden></ul>
      </div>
      <div id="property"></div>
    </section>

    <section class="card" id="summary">
      <div><span class="label">City tax</span><span id="city-tax" class="big">-</span></div>
      <div><span class="label">County tax</span><span id="county-tax" class="big">-</span></div>
      <div><span class="label">Total</span><span id="total-tax" class="big">-</span></div>
    </section>

    <section class="card">
      <h2>Where your city tax goes</h2>
      <canvas id="dept-chart"></canvas>
    </section>

    <section class="card">
      <h2>Your share of capital projects</h2>
      <ul id="projects"></ul>
    </section>

    <section class="card">
      <h2>Ask about your tax bill</h2>
      <form id="ask-form">
        <input id="question" placeholder="Why did my bill go up?">
        <button>Ask</button>
      </form>
      <p id="answer"></p>
    </section>
  </main>

  <footer>Water and sewer are funded by utility fees, not property tax, so they aren't included.</footer>
  <script src="app.js"></script>
</body>
</html>
