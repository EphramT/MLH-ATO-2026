# DigitalOcean App Platform spec.
# Dashboard: Apps > Create App > GitHub > EphramT/MLH-ATO-2026, then Settings > App Spec > paste this.
# CLI: doctl apps create --spec .do/app.yaml
name: raleigh-tax-tracker
region: nyc
services:
  - name: web
    github:
      repo: EphramT/MLH-ATO-2026
      branch: main
      deploy_on_push: true
    environment_slug: python
    run_command: gunicorn --bind 0.0.0.0:8080 --workers 2 --timeout 60 app:app
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /healthz
    envs:
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GEMINI_MODEL
        scope: RUN_TIME
        value: gemini-2.5-flash
      - key: SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: SENTRY_RELEASE
        scope: RUN_TIME
        value: ${_self.COMMIT_HASH}
      - key: SENTRY_TRACES_SAMPLE_RATE
        scope: RUN_TIME
        value: "0.2"
