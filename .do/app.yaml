# DigitalOcean App Platform spec. Deploy with: doctl apps create --spec .do/app.yaml
name: raleigh-tax-tracker
region: nyc
services:
  - name: web
    github:
      repo: YOUR_GITHUB_USER/YOUR_REPO # TODO
      branch: main
      deploy_on_push: true
    environment_slug: python
    run_command: gunicorn --bind 0.0.0.0:8080 app:app
    http_port: 8080
    instance_size_slug: basic-xxs
    instance_count: 1
    envs:
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GEMINI_MODEL
        scope: RUN_TIME
        value: gemini-2.5-flash
